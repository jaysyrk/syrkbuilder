name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          mc=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          awk -v head="## $version" '$0 == head {f = 1; next} /^## / {f = 0} f' CHANGELOG.md > notes.md
          jar="fabric/build/libs/syrkbuilder-fabric-$version+$mc.jar"
          ls -la fabric/build/libs
          tag="$GITHUB_REF_NAME"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            tag="v$version+$mc"
          fi
          gh release create "$tag" "$jar" --target "$GITHUB_SHA" --title "SyrkBuilder $version for Minecraft $mc" --notes-file notes.md

      - name: Upload to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
        run: |
          if [ -z "$MODRINTH_TOKEN" ] || [ -z "$MODRINTH_PROJECT_ID" ]; then
            echo "::notice::Skipped Modrinth: set the MODRINTH_TOKEN secret and the MODRINTH_PROJECT_ID variable to publish there too"
            exit 0
          fi
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          mc=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          jq -n \
            --arg project "$MODRINTH_PROJECT_ID" \
            --arg name "SyrkBuilder $version for Minecraft $mc" \
            --arg number "$version+$mc" \
            --arg mc "$mc" \
            --arg fabric_api P7dR8mSH \
            --rawfile changelog notes.md \
            '{project_id: $project, name: $name, version_number: $number, changelog: $changelog,
              game_versions: [$mc], loaders: ["fabric"], version_type: "release", featured: false,
              dependencies: [{project_id: $fabric_api, dependency_type: "required"}],
              file_parts: ["file"], primary_file: "file"}' > modrinth.json
          curl --fail-with-body -sS https://api.modrinth.com/v2/version \
            -H "Authorization: $MODRINTH_TOKEN" \
            -H "User-Agent: jaysyrk/syrkbuilder release workflow" \
            -F "data=<modrinth.json;type=application/json" \
            -F "file=@fabric/build/libs/syrkbuilder-fabric-$version+$mc.jar;type=application/java-archive"
